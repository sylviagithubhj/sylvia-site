<div class="mono" style="padding: 14px 20px 0; font-size: 11px; color: #7c7c7c"><a href="index.html">함께 일하기</a> / <span style="color: #fff">프로젝트 문의</span></div>
<section style="padding: 20px 20px 20px; display: flex; flex-direction: column; gap: 16px"><span class="eyebrow">프로젝트 문의</span><h1 class="h1">어떤 프로덕트인지 알려주세요</h1><p class="lead">3영업일 안에 답장해요. 제가 맞지 않으면 솔직하게 말씀드릴게요.</p></section>
<form id="iform" onsubmit="return sendInquiry()" style="padding: 20px 20px 40px; display: flex; flex-direction: column; gap: 16px">
<label class="field"><span>이름</span><input id="f_name" class="input" style="color:#fff" placeholder="이름"></label>
<label class="field"><span>회사 이메일</span><input id="f_email" class="input" type="email" style="color:#fff" placeholder="you@company.com"></label>
<label class="field"><span>회사와 나라</span><input id="f_company" class="input" style="color:#fff" placeholder="예: 핀테크 · 싱가포르"></label>
<div class="field"><span>어떤 도움이 필요하세요?</span><div id="needs" style="display: flex; flex-wrap: wrap; gap: 8px"><button type="button" class="chip on" onclick="this.classList.toggle('on')">한국 시장 진출</button><button type="button" class="chip" onclick="this.classList.toggle('on')">UX 진단</button><button type="button" class="chip" onclick="this.classList.toggle('on')">프로덕트 디자인</button><button type="button" class="chip" onclick="this.classList.toggle('on')">기타</button></div></div>
<label class="field"><span>자세히 알려주세요</span><textarea id="f_detail" class="input" style="height: 110px; align-items: flex-start; padding-top: 14px; color:#fff; resize:vertical" placeholder="프로덕트, 사용자, 일정"></textarea></label>
<button type="submit" class="btn b1" style="margin-top: 8px">문의 보내기</button>
</form>
</div>
<script>
function sendInquiry(){
  var name=document.getElementById('f_name').value;
  var email=document.getElementById('f_email').value;
  var company=document.getElementById('f_company').value;
  var detail=document.getElementById('f_detail').value;
  var needs=Array.prototype.filter.call(document.querySelectorAll('#needs .chip'),function(c){return c.classList.contains('on')}).map(function(c){return c.textContent}).join(', ');
  var body='이름: '+name+'\n이메일: '+email+'\n회사와 나라: '+company+'\n필요한 도움: '+needs+'\n\n'+detail;
  location.href='mailto:heejuk@mail.hongik.ac.kr?subject='+encodeURIComponent('[프로젝트 문의] '+(company||name))+'&body='+encodeURIComponent(body);
  return false;
}
</script>
</body>
