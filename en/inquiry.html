<div class="mono" style="padding: 14px 20px 0; font-size: 11px; color: #7c7c7c"><a href="index.html">Work with Heeju</a> / <span style="color: #fff">Project inquiry</span></div>
<section style="padding: 20px 20px 20px; display: flex; flex-direction: column; gap: 16px"><span class="eyebrow">Project inquiry</span><h1 class="h1">Tell me about your product</h1><p class="lead">I reply within 3 business days. If I am not the right fit, I will say so.</p></section>
<form id="iform" onsubmit="return sendInquiry()" style="padding: 20px 20px 40px; display: flex; flex-direction: column; gap: 16px">
<label class="field"><span>Name</span><input id="f_name" class="input" style="color:#fff" placeholder="Your name"></label>
<label class="field"><span>Work email</span><input id="f_email" class="input" type="email" style="color:#fff" placeholder="you@company.com"></label>
<label class="field"><span>Company and country</span><input id="f_company" class="input" style="color:#fff" placeholder="e.g. Fintech · Singapore"></label>
<div class="field"><span>What do you need?</span><div id="needs" style="display: flex; flex-wrap: wrap; gap: 8px"><button type="button" class="chip on" onclick="this.classList.toggle('on')">Korea market entry</button><button type="button" class="chip" onclick="this.classList.toggle('on')">UX review</button><button type="button" class="chip" onclick="this.classList.toggle('on')">Product design</button><button type="button" class="chip" onclick="this.classList.toggle('on')">Other</button></div></div>
<label class="field"><span>Tell me more</span><textarea id="f_detail" class="input" style="height: 110px; align-items: flex-start; padding-top: 14px; color:#fff; resize:vertical" placeholder="Your product, users, timeline"></textarea></label>
<button type="submit" class="btn b1" style="margin-top: 8px">Send inquiry</button>
</form>
</div>
<script>
function sendInquiry(){
  var name=document.getElementById('f_name').value;
  var email=document.getElementById('f_email').value;
  var company=document.getElementById('f_company').value;
  var detail=document.getElementById('f_detail').value;
  var needs=Array.prototype.filter.call(document.querySelectorAll('#needs .chip'),function(c){return c.classList.contains('on')}).map(function(c){return c.textContent}).join(', ');
  var body='Name: '+name+'\nEmail: '+email+'\nCompany and country: '+company+'\nNeeds: '+needs+'\n\n'+detail;
  location.href='mailto:heejuk@mail.hongik.ac.kr?subject='+encodeURIComponent('[Project inquiry] '+(company||name))+'&body='+encodeURIComponent(body);
  return false;
}
</script>
</body>
